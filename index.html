<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>AR Business Card - Nazaret Esquivel</title>
    
    <!-- Librerías de A-Frame y AR.js -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/jeromeetienne/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        /* CSS para la interfaz superpuesta */
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #ui-overlay {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 15px;
            z-index: 1000; /* Asegura que esté sobre la cámara */
        }
        .btn {
            background-color: #0047AB;
            color: white;
            border: 2px solid #00FF41;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body style="margin : 0px; overflow: hidden;">

    <!-- Botones HTML superpuestos en la pantalla -->
    <div id="ui-overlay">
        <a href="https://linkedin.com/in/tu-perfil" class="btn" target="_blank">LinkedIn</a>
        <a href="https://github.com/tu-usuario" class="btn" target="_blank">Portafolio</a>
    </div>

    <!-- Escena AR -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
        
        <!-- Carga de recursos (imágenes) -->
        <a-assets>
            <!-- Asegúrate de tener una foto tuya llamada perfil.png en la misma carpeta -->
            <img id="foto-perfil" src="perfil.png">
        </a-assets>

        <!-- Marcador Hiro Frontal -->
        <a-marker preset="hiro">
            
            <!-- Foto de perfil proyectada en AR -->
            <a-image src="#foto-perfil" position="-1.2 0.1 0" rotation="-90 0 0" width="1.5" height="1.5"></a-image>

            <!-- Textos flotantes (JS interno de A-Frame los renderiza en WebGL) -->
            <a-text value="Nazaret Esquivel" position="0 0.1 -0.6" rotation="-90 0 0" color="#0047AB" width="5" font="kelsonsans" align="left"></a-text>
            <a-text value="Futura Ing. en Computacion" position="0 0.1 -0.2" rotation="-90 0 0" color="#333333" width="3" align="left"></a-text>
            <a-text value="Sistemas Embebidos / IoT" position="0 0.1 0.1" rotation="-90 0 0" color="#008000" width="3" align="left"></a-text>
            <a-text value="Tel: +52 XXXXXXXXXX" position="0 0.1 0.4" rotation="-90 0 0" color="#1A1A1A" width="2.5" align="left"></a-text>
            <a-text value="Email: correo@uaz.edu.mx" position="0 0.1 0.7" rotation="-90 0 0" color="#1A1A1A" width="2.5" align="left"></a-text>

            <!-- Elemento 3D decorativo (Ej: un cubo rotando que represente tecnología) -->
            <a-box position="1.5 0.5 0" rotation="0 45 0" color="#00FF41" scale="0.4 0.4 0.4"
                   animation="property: rotation; to: 360 405 0; loop: true; dur: 4000; easing: linear"></a-box>
        </a-marker>

        <!-- Cámara que renderiza la escena -->
        <a-entity camera></a-entity>
    </a-scene>

</body>
</html>
