<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>AR Business Card - Nazaret Esquivel</title>
    
    <!-- Librerías de A-Frame y AR.js -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/jeromeetienne/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        /* CSS para la interfaz superpuesta */
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #ui-overlay {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 15px;
            z-index: 1000;
        }
        .btn {
            background-color: #001524;
            color: #00FF41;
            border: 1px solid #00FF41;
            padding: 12px 24px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.3);
            transition: all 0.2s;
        }
        .btn:active {
            transform: scale(0.95);
            background-color: #00FF41;
            color: #001524;
        }
    </style>
</head>
<body style="margin : 0px; overflow: hidden;">

    <!-- Botones HTML superpuestos en la pantalla del celular -->
    <div id="ui-overlay">
        <!-- Enlace real de GitHub para que el usuario pueda darle clic -->
        <a href="https://github.com/Cindylupis/TecnologiasInmersivas_TarjetaPresentacion.git" class="btn" target="_blank">Ver Repositorio</a>
    </div>

    <!-- Escena AR -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
        
        <a-assets>
            <!-- Asegúrate de tener la última imagen futurista generada guardada como perfil.png -->
            <img id="foto-perfil" src="perfil.png">
        </a-assets>

        <!-- Marcador Hiro Frontal -->
        <a-marker preset="hiro">
            
            <!-- FONDO DEL HOLOGRAMA (Para que no se pierdan los textos) -->
            <!-- opacity="0.8" lo hace semi-transparente, color="#001a2c" es un azul marino oscuro -->
            <a-plane position="0 0.1 0" rotation="-90 0 0" width="4.5" height="2.5" color="#000B18" opacity="0.85"></a-plane>

            <!-- Foto de perfil proyectada en AR -->
            <a-image src="#foto-perfil" position="-1.3 0.12 0" rotation="-90 0 0" width="1.6" height="1.6"></a-image>

            <!-- Textos flotantes posicionados sobre el panel de fondo -->
            <!-- Nombre -->
            <a-text value="Maria Nazaret Esquivel Davila" position="-0.3 0.12 -0.7" rotation="-90 0 0" color="#00FF41" width="3.5" font="kelsonsans" align="left"></a-text>
            
            <!-- Especialidad -->
            <a-text value="Futura Ingeniera en Computacion" position="-0.3 0.12 -0.3" rotation="-90 0 0" color="#4DA6FF" width="2.5" align="left"></a-text>
            
            <!-- Datos de contacto -->
            <a-text value="Tel: 496 143 6841" position="-0.3 0.12 0.1" rotation="-90 0 0" color="#FFFFFF" width="2.2" align="left"></a-text>
            <a-text value="Email: sporthippy2274@gmail.com" position="-0.3 0.12 0.4" rotation="-90 0 0" color="#FFFFFF" width="2.2" align="left"></a-text>
            
            <!-- Enlace visual de GitHub -->
            <a-text value="GitHub: /Cindylupis/TecnologiasInmersivas..." position="-0.3 0.12 0.7" rotation="-90 0 0" color="#A0A0A0" width="2" align="left"></a-text>

        </a-marker>

        <!-- Cámara que renderiza la escena -->
        <a-entity camera></a-entity>
    </a-scene>

</body>
</html>
